name: Update quest objectives

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: write
  pages: write

concurrency:
  group: quest-objective-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the updater
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Fetch and verify community objectives
        run: python tools/update_objectives.py
      - name: Commit updated objectives
        run: |
          if git diff --quiet -- quest-finder.html; then
            echo 'No objective changes.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add quest-finder.html
            git commit -m 'Update community quest objectives'
            git push origin HEAD:main
          fi
      # GITHUB_TOKEN pushes do not trigger the branch-based Pages workflow.
      - name: Request a GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
